<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 - 바이브 코딩 실습</title>
  <style>
    /* ===== 기본 레이아웃 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Consolas', monospace;
      color: #e2e8f0;
    }

    .game-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    /* ===== 게임 캔버스 ===== */
    #gameCanvas {
      border: 2px solid #334155;
      background: #0f172a;
      display: block;
    }

    /* ===== 사이드 패널 ===== */
    .side-panel {
      width: 150px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
    }

    .panel-box h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .panel-box .value {
      font-size: 28px;
      font-weight: bold;
      color: #e2e8f0;
    }

    /* 게임 오버 오버레이 */
    #overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      font-size: 24px;
      color: #f1f5f9;
    }

    #overlay.show { display: flex; }

    #restartBtn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Consolas', monospace;
    }
    #restartBtn:hover { background: #2563eb; }

    .canvas-wrapper {
      position: relative;
    }

    /* 조작 안내 */
    .controls {
      font-size: 12px;
      color: #475569;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="game-container">

  <!-- 메인 캔버스 -->
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div id="overlay">
      <div>GAME OVER</div>
      <button id="restartBtn">다시 시작</button>
    </div>
  </div>

  <!-- 사이드 패널 -->
  <div class="side-panel">
    <div class="panel-box">
      <h3>점수</h3>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>레벨</h3>
      <div class="value" id="levelDisplay">1</div>
    </div>
    <div class="panel-box">
      <h3>라인</h3>
      <div class="value" id="linesDisplay">0</div>
    </div>
    <div class="panel-box controls">
      <h3>조작법</h3>
      ← → 이동<br>
      ↑ 회전<br>
      ↓ 빠르게<br>
    </div>
  </div>

</div>

<script>
// ============================================================
//  ■ 상수 정의 (Constants) — 이미 완성되어 있습니다
// ============================================================
const COLS        = 10;       // 보드 가로 칸 수
const ROWS        = 20;       // 보드 세로 칸 수
const BLOCK_SIZE  = 30;       // 한 칸의 픽셀 크기

// 테트리스 블록 7종 모양 (1 = 블록 있음)
const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1],
      [1, 1]],
  T: [[0, 1, 0],
      [1, 1, 1]],
  S: [[0, 1, 1],
      [1, 1, 0]],
  Z: [[1, 1, 0],
      [0, 1, 1]],
  L: [[1, 0],
      [1, 0],
      [1, 1]],
  J: [[0, 1],
      [0, 1],
      [1, 1]],
};

// 블록별 색상
const COLORS = {
  I: '#00f0f0',
  O: '#f0f000',
  T: '#a000f0',
  S: '#00f000',
  Z: '#f00000',
  L: '#f0a000',
  J: '#0000f0',
};

// 블록 종류 목록
const PIECE_TYPES = Object.keys(SHAPES);  // ['I','O','T','S','Z','L','J']

// ============================================================
//  ■ 캔버스 초기화 — 이미 완성되어 있습니다
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// ============================================================
//  ■ 게임 상태 변수
// ============================================================
let board        = [];          // 2D 배열: null = 빈칸, 색상 문자열 = 블록
let currentPiece = null;        // 현재 떨어지는 블록 { shape, color, x, y }
let score        = 0;
let level        = 1;
let linesCleared = 0;
let gameOver     = false;
let lastTime     = 0;
let dropInterval = 1000;        // ms — 자동 하강 간격 (레벨에 따라 줄어듦)

// ============================================================
//  ■ 단일 블록 그리기 헬퍼 — 이미 완성되어 있습니다
//    x, y: 보드 기준 칸 좌표
//    color: 채울 색상 문자열
// ============================================================
function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(
    x * BLOCK_SIZE,
    y * BLOCK_SIZE,
    BLOCK_SIZE - 1,
    BLOCK_SIZE - 1
  );

  // 하이라이트 (윗면 밝게)
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 4);
}

// ============================================================
//  TODO 1: initBoard()
//  ─────────────────────────────────────────────────────────
//  보드를 초기화합니다.
//  board 변수를 ROWS × COLS 크기의 2D 배열로 만들고,
//  모든 칸을 null 로 채워주세요.
// ============================================================
function initBoard() {
  // 기존 보드를 비우고 새 2D 배열을 만듭니다.
  board = [];

  // ROWS만큼 행을 만들고, 각 행은 COLS개의 null로 채웁니다.
  for (let r = 0; r < ROWS; r++) {
    board.push(new Array(COLS).fill(null));
  }
}

// ============================================================
//  TODO 2: createPiece()
//  ─────────────────────────────────────────────────────────
//  새 블록을 생성해서 currentPiece에 할당합니다.
// ============================================================
function createPiece() {
  // 7가지 블록 중 하나를 랜덤으로 선택합니다.
  const type = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];

  // 선택된 블록의 모양과 색상을 가져옵니다.
  const shape = SHAPES[type];
  const color = COLORS[type];

  // 블록이 보드 중앙에서 시작하도록 x 좌표를 계산합니다.
  const startX = Math.floor((COLS - shape[0].length) / 2);

  // 현재 블록 객체를 생성합니다.
  currentPiece = {
    shape: shape,
    color: color,
    x: startX,
    y: 0
  };
}

// ============================================================
//  TODO 3: isCollision(piece, dx, dy)
//  ─────────────────────────────────────────────────────────
//  piece 를 (dx, dy) 만큼 이동했을 때 충돌이 발생하면 true,
//  아니면 false 를 반환합니다.
// ============================================================
function isCollision(piece, dx, dy) {
  // 블록의 shape 배열을 행과 열 기준으로 순회합니다.
  for (let row = 0; row < piece.shape.length; row++) {
    for (let col = 0; col < piece.shape[row].length; col++) {

      // shape 값이 0인 칸은 실제 블록이 없으므로 검사하지 않습니다.
      if (piece.shape[row][col] === 0) {
        continue;
      }

      // 이동 후 실제 보드 좌표를 계산합니다.
      const newX = piece.x + col + dx;
      const newY = piece.y + row + dy;

      // 왼쪽 벽 또는 오른쪽 벽과 충돌하는 경우
      if (newX < 0 || newX >= COLS) {
        return true;
      }

      // 바닥과 충돌하는 경우
      if (newY >= ROWS) {
        return true;
      }

      // 보드 내부에서 기존에 고정된 블록과 충돌하는 경우
      // newY >= 0 조건은 혹시 블록 일부가 보드 위쪽에 있을 때 오류를 막기 위한 안전장치입니다.
      if (newY >= 0 && board[newY][newX] !== null) {
        return true;
      }
    }
  }

  // 위의 어떤 조건에도 걸리지 않았다면 충돌이 없습니다.
  return false;
}

// ============================================================
//  TODO 4: rotate(shape)
//  ─────────────────────────────────────────────────────────
//  2D 배열 shape 을 90도 시계 방향으로 회전한 새 배열을 반환합니다.
// ============================================================
function rotate(shape) {
  const rows = shape.length;
  const cols = shape[0].length;
  const rotated = [];

  // 회전 후 배열 크기는 기존 cols × rows 입니다.
  for (let col = 0; col < cols; col++) {
    const newRow = [];

    for (let row = rows - 1; row >= 0; row--) {
      newRow.push(shape[row][col]);
    }

    rotated.push(newRow);
  }

  return rotated;
}

// ============================================================
//  TODO 5: placePiece()
//  ─────────────────────────────────────────────────────────
//  currentPiece 를 board 에 고정시킵니다.
// ============================================================
function placePiece() {
  // 현재 블록이 없으면 아무 작업도 하지 않습니다.
  if (!currentPiece) {
    return;
  }

  // 현재 블록의 shape 배열을 순회합니다.
  for (let row = 0; row < currentPiece.shape.length; row++) {
    for (let col = 0; col < currentPiece.shape[row].length; col++) {

      // 값이 1인 칸만 실제 블록입니다.
      if (currentPiece.shape[row][col] === 1) {
        const boardX = currentPiece.x + col;
        const boardY = currentPiece.y + row;

        // 보드 범위 안에 있는 칸만 고정합니다.
        if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
          board[boardY][boardX] = currentPiece.color;
        }
      }
    }
  }
}

// ============================================================
//  TODO 6: clearLines()
//  ─────────────────────────────────────────────────────────
//  board 에서 모든 칸이 채워진 행(row)을 제거하고
//  위의 행들을 아래로 내려옵니다. 점수도 계산해주세요.
// ============================================================
function clearLines() {
  let cleared = 0;

  // 아래 행부터 위로 검사합니다.
  // 행을 제거하면 인덱스가 바뀌므로 r++로 같은 위치를 다시 검사합니다.
  for (let r = ROWS - 1; r >= 0; r--) {
    const isFull = board[r].every(cell => cell !== null);

    if (isFull) {
      // 가득 찬 행을 제거합니다.
      board.splice(r, 1);

      // 맨 위에 빈 행을 추가합니다.
      board.unshift(new Array(COLS).fill(null));

      // 제거한 줄 수를 증가시킵니다.
      cleared++;

      // 같은 r 위치에 위 행이 내려왔으므로 다시 검사하기 위해 r을 증가시킵니다.
      r++;
    }
  }

  // 제거된 줄이 있을 때만 점수, 라인 수, 레벨, 속도를 갱신합니다.
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800];

    // 한 번에 제거한 줄 수에 따라 점수를 계산합니다.
    score += points[cleared] * level;

    // 누적 제거 라인 수를 갱신합니다.
    linesCleared += cleared;

    // 10줄 제거마다 레벨이 1 증가합니다.
    level = Math.floor(linesCleared / 10) + 1;

    // 레벨이 오를수록 자동 하강 간격을 줄입니다.
    // 최소 간격은 100ms입니다.
    dropInterval = Math.max(100, 1000 - (level - 1) * 100);

    // 화면의 점수, 레벨, 라인 수를 갱신합니다.
    updateUI();
  }
}

// ============================================================
//  TODO 7: draw()
//  ─────────────────────────────────────────────────────────
//  매 프레임 화면을 다시 그립니다.
// ============================================================
function draw() {
  // ① 배경 지우기 — 완성
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자 선 (옅게)
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let c = 0; c < COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * BLOCK_SIZE, 0);
    ctx.lineTo(c * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * BLOCK_SIZE);
    ctx.lineTo(canvas.width, r * BLOCK_SIZE);
    ctx.stroke();
  }

  // ② board에 고정된 블록 그리기
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] !== null) {
        drawBlock(c, r, board[r][c]);
      }
    }
  }

  // ③ 현재 떨어지는 블록 그리기
  if (currentPiece) {
    for (let row = 0; row < currentPiece.shape.length; row++) {
      for (let col = 0; col < currentPiece.shape[row].length; col++) {
        if (currentPiece.shape[row][col] === 1) {
          drawBlock(
            currentPiece.x + col,
            currentPiece.y + row,
            currentPiece.color
          );
        }
      }
    }
  }
}

// ============================================================
//  TODO 8: 키보드 입력 처리
//  ─────────────────────────────────────────────────────────
//  ArrowLeft  : 충돌 없으면 currentPiece.x -= 1
//  ArrowRight : 충돌 없으면 currentPiece.x += 1
//  ArrowDown  : 충돌 없으면 currentPiece.y += 1
//               충돌이면  → placePiece() → clearLines() → createPiece()
//                         → 새 블록도 충돌이면 gameOver = true
//  ArrowUp    : rotate(currentPiece.shape) 후
//               충돌 없으면 currentPiece.shape = 회전된 shape
// ============================================================
document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  if (!currentPiece) return;

  switch (e.key) {
    case 'ArrowLeft':
      // 왼쪽으로 이동했을 때 충돌이 없다면 실제로 이동합니다.
      if (!isCollision(currentPiece, -1, 0)) {
        currentPiece.x -= 1;
      }
      break;

    case 'ArrowRight':
      // 오른쪽으로 이동했을 때 충돌이 없다면 실제로 이동합니다.
      if (!isCollision(currentPiece, 1, 0)) {
        currentPiece.x += 1;
      }
      break;

    case 'ArrowDown':
      // 아래로 이동할 수 있으면 한 칸 내립니다.
      if (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
      } else {
        // 아래로 이동할 수 없으면 현재 블록을 보드에 고정합니다.
        placePiece();

        // 가득 찬 줄을 제거하고 점수를 갱신합니다.
        clearLines();

        // 새 블록을 생성합니다.
        createPiece();

        // 새 블록이 생성되자마자 충돌하면 게임 오버입니다.
        if (isCollision(currentPiece, 0, 0)) {
          gameOver = true;
          showGameOver();
        }
      }
      break;

    case 'ArrowUp':
      // 현재 블록을 회전한 임시 블록을 만듭니다.
      const rotatedShape = rotate(currentPiece.shape);
      const rotatedPiece = {
        shape: rotatedShape,
        color: currentPiece.color,
        x: currentPiece.x,
        y: currentPiece.y
      };

      // 회전 후 충돌이 없다면 회전을 적용합니다.
      if (!isCollision(rotatedPiece, 0, 0)) {
        currentPiece.shape = rotatedShape;
      }
      break;
  }

  draw();  // 이동 후 바로 화면 갱신
});

// ============================================================
//  TODO 9: gameLoop(timestamp)
//  ─────────────────────────────────────────────────────────
//  requestAnimationFrame 으로 반복 호출되는 게임 루프입니다.
// ============================================================
function gameLoop(timestamp) {
  if (gameOver) return;

  // 마지막 프레임 이후 경과 시간을 계산합니다.
  const deltaTime = timestamp - lastTime;

  // 경과 시간이 현재 레벨의 하강 간격보다 크면 블록을 한 칸 내립니다.
  if (deltaTime > dropInterval) {

    // 아래로 한 칸 이동해도 충돌이 없다면 y 좌표를 증가시킵니다.
    if (!isCollision(currentPiece, 0, 1)) {
      currentPiece.y += 1;
    } else {
      // 아래로 이동할 수 없다면 현재 블록을 보드에 고정합니다.
      placePiece();

      // 가득 찬 줄을 제거하고 점수/레벨을 갱신합니다.
      clearLines();

      // 다음 블록을 생성합니다.
      createPiece();

      // 새 블록이 생성되자마자 충돌하면 더 이상 놓을 공간이 없으므로 게임 오버입니다.
      if (isCollision(currentPiece, 0, 0)) {
        gameOver = true;
        showGameOver();
        draw();
        return;
      }
    }

    // 마지막 하강 시간을 현재 timestamp로 갱신합니다.
    lastTime = timestamp;
  }

  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
//  ■ UI 업데이트 헬퍼 — 이미 완성되어 있습니다
// ============================================================
function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('linesDisplay').textContent = linesCleared;
}

// ============================================================
//  ■ 게임 시작 / 재시작 — 이미 완성되어 있습니다
// ============================================================
function startGame() {
  initBoard();
  score        = 0;
  level        = 1;
  linesCleared = 0;
  gameOver     = false;
  dropInterval = 1000;
  lastTime     = 0;

  createPiece();
  updateUI();

  document.getElementById('overlay').classList.remove('show');
  requestAnimationFrame(gameLoop);
}

document.getElementById('restartBtn').addEventListener('click', startGame);

// 게임 오버 시 오버레이 표시는 gameLoop 안에서 처리
// 아래 함수를 호출해서 오버레이를 표시하세요:
function showGameOver() {
  document.getElementById('overlay').classList.add('show');
}

// 게임 시작!
startGame();
</script>
</body>
</html>
